name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests scripts

      - name: Reject tracked infrastructure identifiers
        run: python scripts/check-private-identifiers.py --no-network-ip-detection

      - name: Unit tests
        run: python -m unittest discover -s tests -q

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

  package:
    name: Wheel and core CLI smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Build wheel without runtime extras
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Verify zero-dependency import and CLI parser
        run: |
          python -c "import dsh_mcp_gateway; print(dsh_mcp_gateway.__version__)"
          dsh-mcp-gateway --help
          python -m pip check

      - name: Verify deployment script syntax
        run: bash -n scripts/*.sh

      - name: Verify deployment JavaScript syntax
        run: |
          node --check dsh-bridge-plugin/chatgpt-capability-profile.js
          node --check dsh-bridge-plugin/index.js
          node --check dsh-task-state-plugin/index.js
          node --check dsh-task-state-plugin/task-store.js
          node --check dsh-shell-session-plugin/index.js
          node --check dsh-browser-session-plugin/index.js
          node --check dsh-browser-session-plugin/worker-client.js
          node --check dsh-browser-worker/index.js
          node --check deploy/dsh/plugins/lsm-tool-filter.mjs
          node --check tests/test_lsm_tool_filter.mjs
          node --check tests/test_chatgpt_bridge.mjs
          node --check tests/test_task_state.mjs
          node --check tests/test_shell_session.mjs
          node --check tests/test_browser_session.mjs

      - name: Test deployment JavaScript
        run: |
          node tests/test_lsm_tool_filter.mjs
          node tests/test_chatgpt_bridge.mjs
          node tests/test_task_state.mjs
          node tests/test_shell_session.mjs
          node tests/test_browser_session.mjs

      - name: Verify systemd unit syntax
        run: ./scripts/verify-systemd.sh

  locked-server:
    name: Known-good server dependency graph
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            deploy/server-constraints.txt

      - name: Verify deployment dependency locks
        run: |
          python scripts/verify-server-constraints.py
          python scripts/verify-dsh-runtime-lock.py

      - name: Install constrained server environment
        run: python -m pip install --constraint deploy/server-constraints.txt -e '.[server]'

      - name: Verify constrained dependency graph
        run: |
          python -c "import importlib.metadata as m; import dsh_mcp_gateway, mcp; print('mcp=' + m.version('mcp'))"
          python -m pip check
          python -m unittest discover -s tests -q

  dsh-runtime:
    name: DSH runtime install smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Verify pinned DSH runtime lock
        run: python scripts/verify-dsh-runtime-lock.py

      - name: Install pinned DSH runtime
        working-directory: deploy/dsh-runtime
        run: npm ci --no-audit --no-fund

      - name: Verify installed DSH runtime
        working-directory: deploy/dsh-runtime
        run: |
          test "$(node_modules/.bin/dsh --version)" = "0.1.2-rc.1"
          node -e "Promise.all([import('@deepseek-ai/dsh-terminal'), import('@deepseek-ai/dsh-terminal-bash')])"
          node -e "const p=require('playwright-core/package.json'); if (p.version !== '1.62.1') process.exit(1)"
          node -e "require('koffi')"
          npm ls --depth=0

      - name: Verify Unix peer credential lookup
        working-directory: deploy/dsh-runtime
        run: |
          node --input-type=module <<'NODE'
          import { createServer, createConnection } from 'node:net'
          import { rm } from 'node:fs/promises'
          import { createPeerCredentialReader } from '../../dsh-browser-worker/index.js'
          const path = `${process.env.RUNNER_TEMP}/dsh-peercred.sock`
          await rm(path, { force: true })
          const readPeer = createPeerCredentialReader(process.cwd())
          const server = createServer(socket => {
            const peer = readPeer(socket)
            if (peer.pid !== process.pid) throw new Error(`unexpected peer pid ${peer.pid}`)
            if (process.getuid && peer.uid !== process.getuid()) throw new Error(`unexpected peer uid ${peer.uid}`)
            socket.end()
            server.close()
          })
          await new Promise((resolve, reject) => { server.once('error', reject); server.listen(path, resolve) })
          const client = createConnection(path)
          await new Promise((resolve, reject) => { client.once('end', resolve); client.once('error', reject) })
          await rm(path, { force: true })
          NODE

      - name: Verify pinned Chromium launch
        working-directory: deploy/dsh-runtime
        run: |
          sudo node_modules/.bin/playwright-core install-deps chromium
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/dsh-playwright-browsers"
          node_modules/.bin/playwright-core install --no-shell chromium
          node <<'NODE'
          const { chromium } = require('playwright-core')
          ;(async () => {
            const executablePath = chromium.executablePath()
            console.log('chromium-executable=' + executablePath)
            const browser = await chromium.launch({ headless: true, executablePath })
            const page = await browser.newPage()
            await page.setContent('<title>P5 browser smoke</title><button id="ok">ready</button>')
            if (await page.title() !== 'P5 browser smoke') throw new Error('unexpected Chromium page title')
            if (await page.locator('#ok').textContent() !== 'ready') throw new Error('unexpected Chromium DOM')
            await browser.close()
          })().catch(error => {
            console.error(error)
            process.exit(1)
          })
          NODE
