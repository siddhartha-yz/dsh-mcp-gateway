name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests scripts

      - name: Unit tests
        run: python -m unittest discover -s tests -q

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

  package:
    name: Wheel and core CLI smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel without runtime extras
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Verify zero-dependency import and CLI parser
        run: |
          python -c "import dsh_mcp_gateway; print(dsh_mcp_gateway.__version__)"
          dsh-mcp-gateway --help
          python -m pip check

      - name: Verify systemd unit syntax
        run: ./scripts/verify-systemd.sh

  locked-server:
    name: Known-good server dependency graph
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            deploy/server-constraints.txt

      - name: Verify direct server pins
        run: python scripts/verify-server-constraints.py

      - name: Install constrained server environment
        run: python -m pip install --constraint deploy/server-constraints.txt -e '.[server]'

      - name: Verify constrained dependency graph
        run: |
          python -c "import importlib.metadata as m; import dsh_mcp_gateway, mcp; print('mcp=' + m.version('mcp'))"
          python -m pip check
          python -m unittest discover -s tests -q

  dsh-sdk:
    name: DSH SDK integration imports
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install gateway with all extras
        run: python -m pip install -e '.[all]'

      - name: Verify MCP and DeepSeek Harness imports
        run: python -c "import deepseek_harness, mcp, dsh_mcp_gateway; print('all-imports-ok')"

      - name: Run tests in all-extras environment
        run: python -m unittest discover -s tests -q
