# Primary ChatGPT -> DSH Harness bridge.
# The production layout installs this repository at /srv/dsh-mcp-gateway.
# The plugin exposes only loopback DSH Web Host routes; public OAuth remains
# owned by dsh-mcp-gateway.
- insert:
    # Passive cross-conversation engineering task state. This plugin owns no
    # AgentLoop/model/session execution; it persists records through DSH's
    # native storageDomain service and registers one reviewed ToolRuntime entry.
    - id: chatgpt-task-state
      name: /srv/dsh-mcp-gateway/dsh-task-state-plugin/index.js

    # ChatGPT-only persistent shell surface. The project adapter owns no PTY or
    # process implementation: DSH's native terminal registry/backend retain
    # exact-Agent authorization, bounded output, process cleanup, and the shared
    # sandbox policy. Isolating `terminals` avoids publishing a process-global
    # terminal registry or colliding with agent-preset terminal stacks.
    - id: chatgpt-persistent-shell
      name: cordis:group
      group: true
      isolate:
        terminals: true
      config:
        - id: chatgpt-terminal-registry
          name: '@deepseek-ai/dsh-terminal'

        - id: chatgpt-terminal-bash
          name: '@deepseek-ai/dsh-terminal-bash'
          disabled: !!js process.platform === 'win32'
          config:
            timeoutMs: 300000

        - id: chatgpt-shell-session-tool
          name: /srv/dsh-mcp-gateway/dsh-shell-session-plugin/index.js
          disabled: !!js process.platform === 'win32'

    # ChatGPT-only persistent browser surface. The plugin owns session/page
    # bookkeeping and Playwright protocol control. DSH still computes the
    # sandbox-confined Chromium argv, while a narrow local browser worker launches
    # it under a dedicated AppArmor userns domain + NoNewPrivileges. Neither side
    # contains a model loop, scheduler, shell, or autonomous browser-task runner.
    - id: chatgpt-browser-session-tool
      name: /srv/dsh-mcp-gateway/dsh-browser-session-plugin/index.js
      disabled: !!js process.platform === 'win32'
      config:
        runtimeRoot: /opt/dsh-runtime
        workerSocket: /run/dsh-browser-worker/browser.sock
        profileRoot: /tmp/dsh-browser-worker
        startupTimeoutMs: 15000
        maxSessionsGlobal: 3
        maxSessionsPerOwner: 2

    # Experimental DSH GUI <-> hidden ChatGPT Web transport. The plugin owns
    # only a bounded mailbox plus Web GUI status/control UI; it contains no
    # model invocation or autonomous reasoning loop.
    - id: chatgpt-web-bridge-experiment
      name: /srv/dsh-mcp-gateway/dsh-chatgpt-web-bridge-plugin/index.js

    - id: chatgpt-harness-bridge
      name: /srv/dsh-mcp-gateway/dsh-bridge-plugin/index.js
      config:
        # Community/plugin ToolRuntime entries are external-agent capabilities
        # only after explicit review. DSH AgentLoop lifecycle tools remain
        # reserved and cannot be exposed through this generic opt-in list.
        allowExtraTools:
          - task_state
          - shell_session
          - browser_session
          - chatgpt_web_bridge
