[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-mcp-gateway"
version = "0.0.1.dev0"
description = "Experimental MCP gateway for durable DeepSeek Harness agent sessions"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "siddhartha-yz" }]
dependencies = []

[project.scripts]
dsh-mcp-gateway = "dsh_mcp_gateway.cli:main"

[project.optional-dependencies]
server = ["mcp>=2,<3"]
dsh = ["deepseek-harness-sdk==0.1.0rc6"]
dev = ["mcp>=2,<3", "ruff>=0.16,<1"]
all = ["mcp>=2,<3", "deepseek-harness-sdk==0.1.0rc6"]

[project.urls]
Repository = "https://github.com/siddhartha-yz/dsh-mcp-gateway"
Issues = "https://github.com/siddhartha-yz/dsh-mcp-gateway/issues"

[tool.setuptools.packages.find]
where = ["src"]
